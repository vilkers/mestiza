<!doctype html>
<html lang="pt-BR" data-construction>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#080808">
  <title>Mestiza · AI creative studio</title>
  <meta name="description" content="Mestiza. Direção de arte, imagens e filmes. São Paulo e Espírito Santo. Nosso novo site está em construção. Fale com a gente: hablar@mestiza.work.">
  <link rel="icon" href="/assets/favicon-moeda.png">
  <link rel="stylesheet" href="/css/construction.css?v=20261103">
  <script src="/js/access-gate.js?v=20261103"></script>
  <script src="/js/construction.js?v=20261103" defer></script>
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <img src="/assets/cases/boticario/video/hero-poster.jpg" alt="" fetchpriority="high">
    <video muted autoplay loop playsinline preload="metadata" poster="/assets/cases/boticario/video/hero-poster.jpg" data-desktop="/assets/cases/boticario/video/banner-selecao-desktop.mp4" data-mobile="/assets/cases/boticario/video/banner-selecao-mobile.mp4"></video>
  </div>
  <div class="page">
    <header class="masthead">
      <a href="/em-construcao/" class="brand" aria-label="Mestiza"><span class="glass-wordmark" role="img" aria-label="Mestiza"></span></a>
      <span class="status"><i aria-hidden="true"></i> Site em construção</span>
    </header>
    <main>
      <div class="overline"><span>AI creative studio</span><span>São Paulo / Espírito Santo</span></div>
      <h1><span>Haz lo que</span><span>quieras</span><span>hacer.</span></h1>
      <div class="lower">
        <div class="intro"><p>Direção de arte, imagens e filmes.</p><p>Nosso novo site está em construção.<br>As conversas continuam por aqui.</p></div>
        <button class="access-button" type="button" data-open-access>Acessar site <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19 19 5M5 5h14v14"/></svg></button>
      </div>
    </main>
    <footer><a class="email" href="mailto:hablar@mestiza.work">hablar@mestiza.work <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19 19 5M5 5h14v14"/></svg></a><span>Mestiza © 2026</span></footer>
  </div>
  <dialog aria-labelledby="access-title" class="access-dialog">
    <button type="button" class="close-dialog" aria-label="Fechar" data-close-access><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
    <form data-access-form>
      <span class="dialog-eyebrow">Mestiza / Prévia</span>
      <h2 id="access-title">Entre para ver.</h2>
      <label for="preview-password">Senha de acesso</label>
      <input id="preview-password" name="password" type="password" autocomplete="current-password" required aria-describedby="access-error">
      <p id="access-error" role="status" aria-live="polite"></p>
      <button class="submit-access" type="submit">Entrar <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16M13 5l7 7-7 7"/></svg></button>
    </form>
  </dialog>
</body>
</html>
