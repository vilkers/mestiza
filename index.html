<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mestiza — em breve</title>
  <meta name="description" content="Mestiza — creative studio. Site em construção." />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:    #000000;
      --fg:    #f4f1ea;
      --dim:   #8a867d;
      --accent:#c9a86a;
      --mono:  "Spline Sans Mono", ui-monospace, Menlo, monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--mono);
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100svh;
      padding: 8vh 24px;
      text-align: center;
    }
    .wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(28px, 6vh, 64px);
      max-width: 560px;
      width: 100%;
    }

    /* spinning coin gif (auto-hides if the file isn't there yet) */
    .coin {
      width: clamp(150px, 34vw, 240px);
      height: auto;
    }

    /* horizontal wordmark, forced white on black */
    .logo {
      width: clamp(220px, 60vw, 380px);
      height: auto;
      filter: brightness(0) invert(1);
    }

    .status {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.32em;
      color: var(--dim);
      display: inline-flex;
      align-items: center;
      gap: 0.7em;
    }
    .status .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }

    .mail {
      font-size: clamp(0.95rem, 3.6vw, 1.15rem);
      letter-spacing: 0.04em;
      color: var(--fg);
      border-bottom: 1px solid rgba(244,241,234,0.25);
      padding-bottom: 4px;
      transition: color 0.3s, border-color 0.3s;
    }
    .mail:hover { color: var(--accent); border-color: var(--accent); }
    a { text-decoration: none; color: inherit; }

    @media (prefers-reduced-motion: reduce) {
      .status .dot { animation: none; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <!-- spinning coin; hides itself until the gif lands in the repo -->
    <img class="coin" src="assets/construction.gif" alt="Mestiza"
         onerror="this.style.display='none'" />

    <!-- horizontal wordmark -->
    <img class="logo" src="assets/logo/logo-horizontal.png" alt="Mestiza"
         onerror="this.style.display='none'" />

    <p class="status"><span class="dot"></span>Em construção</p>

    <a class="mail" href="mailto:hablar@mestiza.work">hablar@mestiza.work</a>
  </main>
</body>
</html>
