<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mestiza — em breve</title>
  <meta name="description" content="Mestiza — creative studio. Site em construção." />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:wght@400;500&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:    #000000;
      --fg:    #f4f1ea;
      --dim:   #8a867d;
      --accent:#c9a86a;
      --mono:  "Spline Sans Mono", ui-monospace, Menlo, monospace;
      --serif: "STIX Two Text", Georgia, serif;
      --gap:   clamp(12px, 1.4vw, 22px);   /* mesmo espaçamento h e v */
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--mono);
      -webkit-font-smoothing: antialiased;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      overflow: hidden;                 /* page itself doesn't scroll */
      position: relative;
    }

    /* ===== drifting image background — 5 full-bleed columns ===== */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      display: flex;
      gap: var(--gap);
      pointer-events: none;
    }
    .bg-col {
      flex: 1 1 0;                       /* equal cols → full width */
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: var(--gap);                  /* vertical = horizontal */
      will-change: transform;
    }
    .bg-col img {
      width: 100%;
      height: auto;                     /* ratio original de cada imagem */
      opacity: 0.6;                     /* contraste no fundo preto */
      border-radius: 2px;
    }
    .bg-col--a { animation: driftUp   95s linear infinite; }
    .bg-col--b { animation: driftDown 120s linear infinite; }
    .bg-col--c { animation: driftUp   105s linear infinite; }
    @keyframes driftUp   { from { transform: translateY(0); }    to { transform: translateY(-50%); } }
    @keyframes driftDown { from { transform: translateY(-50%); } to { transform: translateY(0); } }

    /* center scrim so the logo / email stay readable */
    .scrim {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: radial-gradient(ellipse 70% 60% at center,
                  rgba(0,0,0,0.86) 0%,
                  rgba(0,0,0,0.58) 45%,
                  rgba(0,0,0,0.40) 100%);
    }

    /* ===== centered content ===== */
    .wrap {
      position: relative;
      z-index: 2;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(26px, 5.5vh, 56px);
      padding: 12vh 24px 4vh;
      text-align: center;
    }
    .coin { width: clamp(140px, 30vw, 220px); height: auto; }
    .logo {
      width: clamp(220px, 56vw, 360px);
      height: auto;
      filter: brightness(0) invert(1);
    }
    .status {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.32em;
      color: var(--dim);
      display: inline-flex;
      align-items: center;
      gap: 0.7em;
    }
    .status .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }
    .mail {
      font-size: clamp(0.95rem, 3.6vw, 1.15rem);
      letter-spacing: 0.04em;
      color: var(--fg);
      border-bottom: 1px solid rgba(244,241,234,0.25);
      padding-bottom: 4px;
      transition: color 0.3s, border-color 0.3s;
    }
    .mail:hover { color: var(--accent); border-color: var(--accent); }
    a { text-decoration: none; color: inherit; }

    /* ===== footer tagline ===== */
    .tagline {
      position: relative;
      z-index: 2;
      font-family: var(--serif);
      font-weight: 400;
      text-transform: lowercase;
      text-align: center;
      color: var(--fg);
      font-size: clamp(0.66rem, 1.8vw, 1.05rem);
      letter-spacing: clamp(0.16em, 0.5vw, 0.42em);
      padding: 0 24px clamp(22px, 4vh, 40px);
    }

    @media (prefers-reduced-motion: reduce) {
      .bg-col { animation: none !important; }
      .status .dot { animation: none; }
    }
    @media (max-width: 640px) {
      .bg-col--c { display: none; }     /* 2 cols on phones */
    }
  </style>
</head>
<body>

  <!-- drifting image feed -->
  <div class="bg" id="bg" aria-hidden="true"></div>
  <div class="scrim" aria-hidden="true"></div>

  <!-- centered content -->
  <main class="wrap">
    <img class="coin" src="assets/construction.gif" alt="Mestiza"
         onerror="this.style.display='none'" />
    <img class="logo" src="assets/logo/logo-horizontal.png" alt="Mestiza"
         onerror="this.style.display='none'" />
    <p class="status"><span class="dot"></span>Em construção</p>
    <a class="mail" href="mailto:hablar@mestiza.work">hablar@mestiza.work</a>
  </main>

  <!-- footer tagline -->
  <footer class="tagline">haz lo que quieras hacer</footer>

  <script>
    // Curated dark/cinematic frames (lightweight), drifting in 5 columns.
    (function () {
      var COUNT = 11;                       // assets/bg/01.jpg … 11.jpg
      var paths = [];
      for (var n = 1; n <= COUNT; n++) {
        paths.push("assets/bg/" + (n < 10 ? "0" + n : n) + ".jpg");
      }

      var cols = 3, perCol = 5, k = 0;
      var buckets = [[], [], []];
      for (var c = 0; c < cols; c++) {
        for (var j = 0; j < perCol; j++) {
          buckets[c].push(paths[k % paths.length]);   // cycle so each col is tall + varied
          k++;
        }
      }

      var names = ["a", "b", "c"];
      var bg = document.getElementById("bg");
      buckets.forEach(function (list, ci) {
        var col = document.createElement("div");
        col.className = "bg-col bg-col--" + names[ci];
        // duplicate the list so the vertical loop is seamless (-50%)
        list.concat(list).forEach(function (src) {
          var img = new Image();
          img.src = src;
          img.alt = "";
          img.loading = "lazy";
          col.appendChild(img);
        });
        bg.appendChild(col);
      });
    })();
  </script>
</body>
</html>
