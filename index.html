<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mestiza — em breve</title>
  <meta name="description" content="Mestiza — creative studio. Site em construção." />
  <link rel="icon" type="image/png" href="assets/favicon-moeda.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:wght@400;500&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:    #000000;
      --fg:    #f4f1ea;
      --dim:   #8a867d;
      --accent:#c9a86a;
      --mono:  "Spline Sans Mono", ui-monospace, Menlo, monospace;
      --serif: "STIX Two Text", Georgia, serif;
      --gap:   clamp(12px, 1.4vw, 22px);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--serif);
      -webkit-font-smoothing: antialiased;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* ===== drifting image background — 3 columns ===== */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      display: flex;
      gap: var(--gap);
      pointer-events: none;
    }
    .bg-col {
      flex: 1 1 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: var(--gap);
      will-change: transform;
    }
    .bg-col img {
      width: 100%;
      height: auto;
      opacity: 0.6;
      border-radius: 2px;
    }

    /* center scrim so the logo / email stay readable — soft even vignette */
    .scrim {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: radial-gradient(ellipse 95% 80% at center,
                  rgba(0,0,0,0.62) 0%,
                  rgba(0,0,0,0.46) 55%,
                  rgba(0,0,0,0.34) 100%);
    }

    /* ===== centered content ===== */
    .wrap {
      position: relative;
      z-index: 2;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(26px, 5.5vh, 56px);
      padding: 12vh 24px 4vh;
      text-align: center;
    }
    .coin { width: clamp(140px, 30vw, 220px); height: auto; }
    .logo {
      width: clamp(220px, 56vw, 360px);
      height: auto;
      /* off-white (#f4f1ea), sem branco puro */
      filter: brightness(0) invert(1) brightness(0.96) sepia(0.07);
    }
    .status {
      font-family: var(--serif);
      font-size: clamp(0.62rem, 1.5vw, 0.82rem);
      text-transform: lowercase;
      letter-spacing: 0.04em;
      color: var(--dim);
      display: inline-flex;
      align-items: center;
      gap: 0.7em;
    }
    .status .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }
    .mail {
      font-family: var(--serif);
      font-size: clamp(0.9rem, 2.6vw, 1.1rem);
      letter-spacing: 0.02em;
      color: var(--fg);
      border-bottom: 1px solid rgba(244,241,234,0.25);
      padding-bottom: 4px;
      transition: color 0.3s, border-color 0.3s;
    }
    .mail:hover { color: var(--accent); border-color: var(--accent); }
    a { text-decoration: none; color: inherit; }

    /* ===== footer tagline ===== */
    .tagline {
      position: relative;
      z-index: 2;
      font-weight: 400;
      text-transform: lowercase;
      text-align: center;
      color: var(--fg);
      font-size: clamp(0.66rem, 1.8vw, 1.05rem);
      letter-spacing: clamp(0.16em, 0.5vw, 0.42em);
      padding: 0 24px clamp(22px, 4vh, 40px);
    }

    @media (prefers-reduced-motion: reduce) {
      .status .dot { animation: none; }
    }
    @media (max-width: 640px) {
      .bg-col:nth-child(3) { display: none; }
    }
  </style>
</head>
<body>

  <!-- drifting image feed -->
  <div class="bg" id="bg" aria-hidden="true"></div>
  <div class="scrim" aria-hidden="true"></div>

  <!-- centered content -->
  <main class="wrap">
    <img class="coin" src="assets/construction.gif" alt="Mestiza"
         onerror="this.style.display='none'" />
    <img class="logo" src="assets/logo/logo-horizontal.png" alt="Mestiza"
         onerror="this.style.display='none'" />
    <p class="status"><span class="dot"></span>Em construção</p>
    <a class="mail" href="mailto:hablar@mestiza.work">hablar@mestiza.work</a>
  </main>

  <!-- footer tagline -->
  <footer class="tagline">haz lo que quieras hacer</footer>

  <script>
    (function () {
      var COUNT = 38;
      var paths = [];
      for (var n = 1; n <= COUNT; n++) {
        paths.push('assets/bg/' + (n < 10 ? '0' + n : n) + '.jpg');
      }

      var colEls = [];
      var allImgs = [];
      var bg = document.getElementById('bg');
      var offsets = [0, 13, 26];

      offsets.forEach(function (offset) {
        var list = paths.slice(offset).concat(paths.slice(0, offset));
        var col = document.createElement('div');
        col.className = 'bg-col';
        list.concat(list).forEach(function (src) {
          var img = new Image();
          img.src = src;
          img.alt = '';
          img.decoding = 'async';   // eager (default), sem lazy
          col.appendChild(img);
          allImgs.push(img);
        });
        bg.appendChild(col);
        colEls.push(col);
      });

      var noMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (noMotion) return;

      // Espera imagens carregarem para a altura das colunas estabilizar,
      // depois usa px fixos — elimina o "pisca" do wrap com % dinâmico.
      var loadedCount = 0;
      var started = false;

      function tryStart() {
        if (started) return;
        started = true;
        startAnim();
      }

      allImgs.forEach(function (img) {
        if (img.complete) { loadedCount++; if (loadedCount === allImgs.length) tryStart(); }
        else { img.onload = img.onerror = function () { loadedCount++; if (loadedCount === allImgs.length) tryStart(); }; }
      });
      // fallback: inicia em 2s mesmo que nem tudo tenha carregado
      setTimeout(tryStart, 2000);

      function startAnim() {
        // Mede a metade exata de cada coluna em pixels
        var halfH = colEls.map(function (c) { return c.scrollHeight / 2; });

        // Velocidades em px/ms — independente do refresh rate (60/120/144Hz).
        // Ciclo completo (halfH px) em ~90/110/100 segundos.
        var spd = [
          -halfH[0] / (600 * 1000),
           halfH[1] / (720 * 1000),
          -halfH[2] / (660 * 1000)
        ];

        var px  = [0, -halfH[1], -Math.round(halfH[2] * 0.36)];
        var vel = 1;
        var MAX = 10;
        var lastT = null;

        window.addEventListener('wheel', function (e) {
          vel = Math.min(vel + Math.abs(e.deltaY) / 60 + 0.6, MAX);
        }, { passive: true });

        var lastTouchY = 0;
        window.addEventListener('touchstart', function (e) { lastTouchY = e.touches[0].clientY; }, { passive: true });
        window.addEventListener('touchmove', function (e) {
          var dy = Math.abs(e.touches[0].clientY - lastTouchY);
          lastTouchY = e.touches[0].clientY;
          vel = Math.min(vel + dy / 40 + 0.4, MAX);
        }, { passive: true });

        function tick(now) {
          if (!lastT) lastT = now;
          var dt = Math.min(now - lastT, 64); // cap em 64ms p/ evitar salto ao voltar de aba
          lastT = now;

          vel = 1 + (vel - 1) * Math.pow(0.94, dt / (1000 / 60));

          for (var i = 0; i < 3; i++) {
            px[i] += spd[i] * vel * dt;
            if (spd[i] < 0 && px[i] <= -halfH[i]) px[i] += halfH[i];
            if (spd[i] > 0 && px[i] >= 0)          px[i] -= halfH[i];
            colEls[i].style.transform = 'translateY(' + px[i] + 'px)';
          }
          requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
      }
    })();
  </script>
</body>
</html>
